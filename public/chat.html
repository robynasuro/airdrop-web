<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat - 0xcreamy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">0xcreamy</div>
        <button class="hamburger" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-links">
            <a href="/index.html">Airdrop List</a>
            <a href="/chat.html" class="active">Global Chat</a>
            <a href="#" onclick="showLoginModal()">Admin Dashboard</a>
            <button id="darkModeToggle" class="dark-mode-btn">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- Chat Content -->
    <div class="chat-container">
        <h1>Global Chat</h1>
        <div id="chat" class="chat-box"></div>
        <div class="chat-input-group">
            <input type="text" id="username" placeholder="Your username" required>
            <input type="text" id="message" placeholder="Type a message">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLoginModal()">×</span>
            <h2>Admin Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <label for="modalPassword">Admin Password:</label>
                <input type="password" id="modalPassword" name="password" required>
                <button type="submit">Login</button>
            </form>
            <p id="loginMessage"></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 0xcreamy. All rights reserved.</p>
        <div class="footer-links">
            <a href="https://x.com/0xCreamy" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-x-twitter"></i>
            </a>
            <a href="https://github.com/robynasuro" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </footer>

    <!-- Socket.IO and Chat Script -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        const socket = io();
        const chat = document.getElementById("chat");
        const messageInput = document.getElementById("message");
        const usernameInput = document.getElementById("username");

        // Fungsi untuk simpan pesan ke localStorage
        function saveMessageToStorage(msg) {
            let messages = JSON.parse(localStorage.getItem("chatMessages")) || [];
            messages.push(msg);
            localStorage.setItem("chatMessages", JSON.stringify(messages));
        }

        // Fungsi untuk load pesan dari localStorage
        function loadMessagesFromStorage() {
            let messages = JSON.parse(localStorage.getItem("chatMessages")) || [];
            messages.forEach((msg) => {
                const p = document.createElement("p");
                p.textContent = msg;
                chat.appendChild(p);
            });
            chat.scrollTop = chat.scrollHeight;
        }

        // Load pesan dari localStorage saat halaman di-load
        window.onload = function () {
            loadMessagesFromStorage();
        };

        // Kirim pesan
        function sendMessage() {
            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();
            if (username && message) {
                const msg = `${username}: ${message}`;
                socket.emit("chat message", msg); // Kirim pesan ke server
                messageInput.value = "";
            } else {
                alert("Please enter both username and message!");
            }
        }

        // Terima pesan dari server
        socket.on("chat message", (msg) => {
            const p = document.createElement("p");
            p.textContent = msg;
            chat.appendChild(p);
            chat.scrollTop = chat.scrollHeight;
            saveMessageToStorage(msg); // Simpan pesan ke localStorage
        });

        // Kirim pesan pas tekan Enter
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        // Toggle menu untuk navbar responsif
        function toggleMenu() {
            const navbarLinks = document.querySelector(".navbar-links");
            const hamburgerIcon = document.querySelector(".hamburger i");
            navbarLinks.classList.toggle("active");
            if (navbarLinks.classList.contains("active")) {
                hamburgerIcon.classList.remove("fa-bars");
                hamburgerIcon.classList.add("fa-times");
            } else {
                hamburgerIcon.classList.remove("fa-times");
                hamburgerIcon.classList.add("fa-bars");
            }
        }

        // Tambah event listener untuk nutup menu pas klik link
        document.addEventListener("DOMContentLoaded", () => {
            const navbarLinks = document.querySelector(".navbar-links");
            const links = navbarLinks.querySelectorAll("a");

            links.forEach(link => {
                link.addEventListener("click", () => {
                    navbarLinks.classList.remove("active");
                    const hamburgerIcon = document.querySelector(".hamburger i");
                    hamburgerIcon.classList.remove("fa-times");
                    hamburgerIcon.classList.add("fa-bars");
                });
            });

            // Nutup menu pas klik di luar navbar
            document.addEventListener("click", (e) => {
                const hamburger = document.querySelector(".hamburger");
                if (!navbarLinks.contains(e.target) && !hamburger.contains(e.target) && navbarLinks.classList.contains("active")) {
                    navbarLinks.classList.remove("active");
                    const hamburgerIcon = document.querySelector(".hamburger i");
                    hamburgerIcon.classList.remove("fa-times");
                    hamburgerIcon.classList.add("fa-bars");
                }
            });
        });

        // Dark Mode Toggle
        const darkModeToggle = document.getElementById("darkModeToggle");
        darkModeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
            const icon = darkModeToggle.querySelector("i");
            if (document.body.classList.contains("dark-mode")) {
                icon.classList.remove("fa-moon");
                icon.classList.add("fa-sun");
                localStorage.setItem("theme", "dark");
            } else {
                icon.classList.remove("fa-sun");
                icon.classList.add("fa-moon");
                localStorage.setItem("theme", "light");
            }
        });

        // Load saved theme
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            darkModeToggle.querySelector("i").classList.remove("fa-moon");
            darkModeToggle.querySelector("i").classList.add("fa-sun");
        }

        // Modal Login Functions
        function showLoginModal() {
            document.getElementById("loginModal").classList.add("active");
        }

        function closeLoginModal() {
            document.getElementById("loginModal").classList.remove("active");
            document.getElementById("loginForm").reset();
            document.getElementById("loginMessage").textContent = "";
        }

        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById("modalPassword").value;
            const messageDiv = document.getElementById("loginMessage");

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password }),
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = "/admin.html"; // Diupdate tanpa .html
                } else {
                    messageDiv.textContent = data.error || "Login failed";
                    messageDiv.style.color = "red";
                }
            } catch (err) {
                messageDiv.textContent = "Error during login";
                messageDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
