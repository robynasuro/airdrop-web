<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">0xcreamy</div>
    <button class="hamburger" onclick="toggleMenu()">
      <i class="fas fa-bars"></i>
    </button>
    <div class="navbar-links">
      <a href="/index.html">Airdrop List</a>
      <a href="/chat.html">Global Chat</a>
      <button id="darkModeToggle" class="dark-mode-btn">
        <i class="fas fa-moon"></i>
      </button>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h1>Admin Panel</h1>
    <div class="admin-section">
      <h2>Upload Airdrop</h2>
      <form id="uploadForm">
        <label for="password">Admin Password:</label>
        <input type="password" id="password" name="password" required>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>
        <label for="tier">Tier:</label>
        <input type="text" id="tier" name="tier" required>
        <label for="label">Label:</label>
        <input type="text" id="label" name="label" placeholder="e.g., Crypto, NFT">
        <label for="image">Image:</label>
        <input type="file" id="image" name="image" accept="image/jpeg,image/jpg,image/png">
        <button type="submit">Upload</button>
      </form>
      <p id="uploadMessage"></p>
    </div>
    <div class="admin-section">
      <h2>Manage Airdrops</h2>
      <div id="manageList"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 0xcreamy. All rights reserved.</p>
    <div class="footer-links">
      <a href="https://x.com/0xCreamy" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-x-twitter"></i>
      </a>
      <a href="https://github.com/robynasuro" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-github"></i>
      </a>
    </div>
  </footer>

  <script>
    let editingAirdropId = null;

    fetch("/api/airdrop")
      .then(res => {
        if (!res.ok) {
          throw new Error(`HTTP error! Status: ${res.status}`);
        }
        return res.json();
      })
      .then(data => {
        const list = document.getElementById("manageList");
        list.innerHTML = "";
        if (data.length === 0) {
          list.innerHTML = "<p>No airdrops available.</p>";
          return;
        }
        data.forEach(airdrop => {
          const dotClass = airdrop.status === "active" ? "dot-green" : "dot-red";
          const statusText = airdrop.status === "active" ? "Active" : "Ended";
          const updatedMark = airdrop.lastUpdated ? '<span class="updated-mark">Updated</span>' : '';
          const div = document.createElement("div");
          div.className = "airdrop-item";
          div.innerHTML = `
            ${airdrop.image ? `<img src="${airdrop.image}" alt="${airdrop.title}" class="airdrop-image">` : ""}
            <h3>${airdrop.title} <span class="${dotClass}"></span> <span class="status-text">${statusText}</span> ${updatedMark}</h3>
            <p class="description">${airdrop.description}</p>
            <p><strong>Tier:</strong> ${airdrop.tier}</p>
            ${airdrop.label ? `<p><strong>Label:</strong> ${airdrop.label}</p>` : ""}
            <p><strong>Created:</strong> ${new Date(airdrop.createdAt).toLocaleString()}</p>
            ${airdrop.lastUpdated ? `<p><strong>Last Updated:</strong> ${new Date(airdrop.lastUpdated).toLocaleString()}</p>` : ""}
            <button class="toggle-status-btn" onclick="toggleStatus('${airdrop._id}', '${airdrop.status}')">
              ${airdrop.status === "active" ? "End" : "Activate"}
            </button>
            <button class="edit-btn" onclick="editAirdrop('${airdrop._id}', '${airdrop.title}', \`${airdrop.description}\`, '${airdrop.tier}', '${airdrop.label || ''}')">Edit</button>
            <button class="delete-btn" onclick="deleteAirdrop('${airdrop._id}')">Delete</button>
          `;
          list.appendChild(div);
        });
      })
      .catch(err => {
        console.error("Error fetching airdrops:", err);
        document.getElementById("manageList").innerHTML = "<p>Error loading airdrops: " + err.message + "</p>";
      });

    document.getElementById("uploadForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);

      try {
        const url = editingAirdropId ? `/api/airdrop/${editingAirdropId}` : "/api/airdrop/upload";
        const method = editingAirdropId ? "PUT" : "POST";
        console.log(`Sending ${method} request to ${url}`);
        const res = await fetch(url, {
          method: method,
          body: formData,
          signal: AbortSignal.timeout(10000),
        });
        console.log("Response status:", res.status);
        if (!res.ok) {
          const errorText = await res.text();
          console.error("Error response:", errorText);
          const errorData = JSON.parse(errorText);
          if (res.status === 401) {
            throw new Error("Unauthorized: Incorrect admin password");
          }
          throw new Error(`HTTP error! Status: ${res.status} - ${errorData.error || errorText}`);
        }
        const data = await res.json();
        console.log("Response data:", data);
        const messageDiv = document.getElementById("uploadMessage");
        messageDiv.style.color = res.ok ? "green" : "red";
        messageDiv.textContent = data.message || data.error;
        if (res.ok) {
          form.reset();
          resetForm();
          setTimeout(() => window.location.reload(), 1000);
        }
      } catch (err) {
        console.error("Error uploading/editing airdrop:", err);
        document.getElementById("uploadMessage").textContent = err.message;
        document.getElementById("uploadMessage").style.color = "red";
      }
    });

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === "active" ? "ended" : "active";
      try {
        const res = await fetch(`/api/airdrop/${id}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
          signal: AbortSignal.timeout(10000),
        });
        if (!res.ok) {
          const errorData = await res.json();
          throw new Error(errorData.error || "Failed to toggle status");
        }
        window.location.reload();
      } catch (err) {
        console.error("Error toggling status:", err);
        alert("Error toggling status: " + err.message);
      }
    }

    function editAirdrop(id, title, description, tier, label) {
      editingAirdropId = id;
      document.getElementById("title").value = title;
      document.getElementById("description").value = description;
      document.getElementById("tier").value = tier;
      document.getElementById("label").value = label;
      document.getElementById("uploadForm").querySelector("button").textContent = "Update";
      document.querySelector("h2").textContent = "Edit Airdrop";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      editingAirdropId = null;
      document.getElementById("uploadForm").reset();
      document.getElementById("uploadForm").querySelector("button").textContent = "Upload";
      document.getElementById("uploadMessage").textContent = "";
      document.querySelector("h2").textContent = "Upload Airdrop";
    }

    async function deleteAirdrop(id) {
      if (!confirm("Are you sure you want to delete this airdrop?")) return;
      try {
        const res = await fetch(`/api/airdrop/${id}`, {
          method: "DELETE",
          signal: AbortSignal.timeout(10000),
        });
        if (res.ok) {
          window.location.reload();
        } else {
          const errorData = await res.json();
          throw new Error(errorData.error || "Failed to delete airdrop");
        }
      } catch (err) {
        console.error("Error deleting airdrop:", err);
        alert("Error deleting airdrop: " + err.message);
      }
    }

    async function handleLogout() {
      try {
        const res = await fetch("/api/logout", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${localStorage.getItem('token')}` },
          signal: AbortSignal.timeout(10000),
        });
        if (res.ok) {
          localStorage.removeItem('token');
          window.location.href = '/index.html';
        } else {
          const errorData = await res.json();
          throw new Error(errorData.error || "Failed to logout");
        }
      } catch (err) {
        console.error("Error logging out:", err);
        alert("Error logging out: " + err.message);
      }
    }

    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    } else {
      fetch('/admin.html', {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(res => {
        if (res.status === 401) {
          localStorage.removeItem('token');
          window.location.href = '/login.html';
        }
      });
    }

    function toggleMenu() {
      const navbarLinks = document.querySelector(".navbar-links");
      const hamburgerIcon = document.querySelector(".hamburger i");
      navbarLinks.classList.toggle("active");
      if (navbarLinks.classList.contains("active")) {
        hamburgerIcon.classList.remove("fa-bars");
        hamburgerIcon.classList.add("fa-times");
      } else {
        hamburgerIcon.classList.remove("fa-times");
        hamburgerIcon.classList.add("fa-bars");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const navbarLinks = document.querySelector(".navbar-links");
      const links = navbarLinks.querySelectorAll("a");

      links.forEach(link => {
        link.addEventListener("click", () => {
          navbarLinks.classList.remove("active");
          const hamburgerIcon = document.querySelector(".hamburger i");
          hamburgerIcon.classList.remove("fa-times");
          hamburgerIcon.classList.add("fa-bars");
        });
      });

      document.addEventListener("click", (e) => {
        const hamburger = document.querySelector(".hamburger");
        if (!navbarLinks.contains(e.target) && !hamburger.contains(e.target) && navbarLinks.classList.contains("active")) {
          navbarLinks.classList.remove("active");
          const hamburgerIcon = document.querySelector(".hamburger i");
          hamburgerIcon.classList.remove("fa-times");
          hamburgerIcon.classList.add("fa-bars");
        }
      });
    });

    const darkModeToggle = document.getElementById("darkModeToggle");
    darkModeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      const icon = darkModeToggle.querySelector("i");
      if (document.body.classList.contains("dark-mode")) {
        icon.classList.remove("fa-moon");
        icon.classList.add("fa-sun");
        localStorage.setItem("theme", "dark");
      } else {
        icon.classList.remove("fa-sun");
        icon.classList.add("fa-moon");
        localStorage.setItem("theme", "light");
      }
    });

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      darkModeToggle.querySelector("i").classList.remove("fa-moon");
      darkModeToggle.querySelector("i").classList.add("fa-sun");
    }
  </script>
</body>
</html>
